name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # macOS 通用包（Intel + Apple Silicon）→ .dmg
  build-macos-dmg:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Add macOS universal targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Build DMG
        run: npm run tauri -- build --bundles dmg --target universal-apple-darwin

      - name: Normalize DMG name
        run: |
          find src-tauri/target/universal-apple-darwin/release/bundle/dmg -name '*.dmg' -exec mv {} zephyr-macos-universal.dmg \;

      - name: Upload macOS DMG artifact
        uses: actions/upload-artifact@v4
        with:
          name: zephyr-macos-universal
          path: zephyr-macos-universal.dmg

  # Windows 64 位便携绿色版 → 打包成 .zip
  build-windows-portable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Setup Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          override: true

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Build portable exe (no bundle)
        run: npm run tauri -- build --no-bundle

      - name: Package portable zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path staging | Out-Null
          Copy-Item src-tauri/target/release/zephyr.exe staging/zephyr.exe
          Compress-Archive -Path staging/zephyr.exe -DestinationPath zephyr-windows-x86_64.zip -CompressionLevel Optimal

      - name: Upload Windows portable zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: zephyr-windows-portable
          path: zephyr-windows-x86_64.zip

  # 统一重命名并按 zephyr-<版本>-<平台>-<架构>.<后缀> 上传到 Release
  release:
    needs: [build-macos-dmg, build-windows-portable]
    runs-on: ubuntu-latest
    env:
      REF_NAME: ${{ github.ref_name }}
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Normalize artifact names
        run: |
          cd dist
          mv zephyr-windows-portable/zephyr-windows-x86_64.zip "${REF_NAME}-windows-x86_64.zip"
          mv zephyr-macos-universal/zephyr-macos-universal.dmg "${REF_NAME}-macos-universal.dmg"
          ls -la

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          release_name: "泽帆 Zephyr ${{ github.ref_name }}"
          body: "Windows 便携绿色版(.zip) 与 macOS(.dmg) 见本 Release 资产。"
          draft: true
          files: "dist/*.zip"
          files_append: "dist/*.dmg"