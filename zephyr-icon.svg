<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Rounded-square depth navy background -->
  <rect width="512" height="512" rx="112" fill="#0b1220"/>
  <!-- Radial sheen -->
  <radialGradient id="sheen" cx="0.35" cy="0.25" r="0.9">
    <stop offset="0" stop-color="#14233a"/>
    <stop offset="1" stop-color="#0b1220"/>
  </radialGradient>
  <rect width="512" height="512" rx="112" fill="url(#sheen)"/>
  <!-- Inner hairline for depth -->
  <rect x="10" y="10" width="492" height="492" rx="104" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="3"/>

  <!-- Wind streaks (emerald), upper-left -->
  <g stroke="#33d399" stroke-width="26" stroke-linecap="round" stroke-opacity="0.9">
    <path d="M96 168 h56"/>
    <path d="M96 208 h84"/>
    <path d="M96 248 h40"/>
  </g>

  <!-- Wind streak (emerald), upper-right accelerating into the sail -->
  <g stroke="#33d399" stroke-width="22" stroke-linecap="round" stroke-opacity="0.7">
    <path d="M416 128 h34"/>
  </g>

  <!-- Z / sail monogram -->
  <g>
    <!-- Top bar (sail head) -->
    <rect x="128" y="124" width="268" height="74" rx="37" fill="#ffffff"/>
    <!-- Bottom bar (sail foot / hull) -->
    <rect x="128" y="328" width="268" height="74" rx="37" fill="#ffffff"/>
    <!-- Diagonal (taut sail) -->
    <path d="M 396 161 L 128 355" stroke="#33d399" stroke-width="74" stroke-linecap="round" fill="none"/>
  </g>
</svg>